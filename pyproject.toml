[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fold"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["vllm==0.28.0", "numpy"]

[project.entry-points."vllm.general_plugins"]
fold = "fold.vllm_plugin:register"

[tool.setuptools]
packages = ["fold"]
